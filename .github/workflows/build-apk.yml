name: Build and Package APK

on:
  workflow_dispatch:
    inputs:
      package_variant:
        description: "Package variant to build"
        required: true
        default: "apt-android-7"
        type: choice
        options:
          - apt-android-7
          - apt-android-5
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5

    steps:
      - name: Check variant filter for workflow_dispatch
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.package_variant }}" != "${{ matrix.package_variant }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        if: steps.filter.outputs.skip != 'true'
        run: chmod +x ./gradlew

      - name: Build APKs
        if: steps.filter.outputs.skip != 'true'
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail

          APK_DIR_PATH="./app/build/outputs/apk/debug"

          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_VERSION_NAME="${{ github.ref_name }}"
            APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
            APK_VERSION_TAG="${RELEASE_VERSION_NAME}+${PACKAGE_VARIANT}-github-debug"
          else
            COMMIT_SHA="${{ github.sha }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            fi
            CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
            CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
            RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}+${COMMIT_SHA:0:7}"
            APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
            APK_VERSION_TAG="${RELEASE_VERSION_NAME}-${PACKAGE_VARIANT}-github-debug"
          fi

          if ! printf "%s" "$APP_VERSION_NAME" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "Invalid SemVer 2.0.0 versionName: '$APP_VERSION_NAME'"
            exit 1
          fi

          APK_BASENAME_PREFIX="termux-app_${APK_VERSION_TAG}"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="$APP_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew assembleDebug

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if [ ! -f "${APK_DIR_PATH}/${APK_BASENAME_PREFIX}_${abi}.apk" ]; then
              echo "Missing APK: ${APK_DIR_PATH}/${APK_BASENAME_PREFIX}_${abi}.apk"
              ls -la "$APK_DIR_PATH"
              exit 1
            fi
          done

          (
            cd "$APK_DIR_PATH"
            sha256sum \
              "${APK_BASENAME_PREFIX}_universal.apk" \
              "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
              "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
              "${APK_BASENAME_PREFIX}_x86_64.apk" \
              "${APK_BASENAME_PREFIX}_x86.apk" \
              > "${APK_BASENAME_PREFIX}_sha256sums"
          )

      - name: Upload APK Artifacts
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-${{ matrix.package_variant }}-apks
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_*.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach APKs to GitHub Release
        if: steps.filter.outputs.skip != 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_VERSION_NAME }}" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk" \
            "${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums" \
            --clobber
